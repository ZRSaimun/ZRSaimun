name: Live engineering signal

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/live_engine.py"
      - "scripts/research_constellation.py"
      - ".github/workflows/live-engine.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render live profile signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/live_engine.py
          python scripts/research_constellation.py
      - name: Publish changed signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/live-engine.svg generated/research-constellation.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh live engineering signal"
          # Rebase onto any README/activity update that landed while this job was rendering.
          git pull --rebase origin master
          git push origin HEAD:master
