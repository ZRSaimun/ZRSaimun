<g font-family="Arial,Helvetica,sans-serif">
<text x="82" y="103" fill="#eef8fa" font-size="26" font-weight="700" letter-spacing="4">OCEAN × INTELLIGENCE</text>
<text x="82" y="134" fill="#a9c8cf" font-size="14" letter-spacing="2">COMPUTER VISION • UNDERWATER DATA • EXPLORATION</text>
