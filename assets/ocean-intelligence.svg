<circle r="18" opacity=".6"/><circle r="38" opacity=".35"><animate attributeName="r" values="25;62" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="4s" repeatCount="indefinite"/></circle>
<circle r="68" opacity=".18"><animate attributeName="r" values="40;90" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;0" dur="5.5s" repeatCount="indefinite"/></circle>
<path d="M0 0 L72 -28" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></path>
<circle r="4" fill="#d8c08a" filter="url(#g)"/>
</g>
<g fill="#8ad4df" opacity=".55">
