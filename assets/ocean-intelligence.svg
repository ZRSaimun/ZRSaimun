<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-labelledby="t d">
<title id="t">Ocean research signal</title><desc id="d">A restrained animated deep-ocean scene with sonar rings, drifting particles and data nodes.</desc>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071c2c"/><stop offset=".48" stop-color="#06283b"/><stop offset="1" stop-color="#03131f"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8d7448"/><stop offset=".5" stop-color="#d8c08a"/><stop offset="1" stop-color="#8d7448"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="235" rx="22" fill="url(#sea)"/>
<path d="M0 42 Q120 19 240 42 T480 42 T720 42 T960 42 T1200 42" fill="none" stroke="#6fc6d9" stroke-opacity=".18" stroke-width="2"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 42 Q120 19 240 42 T480 42 T720 42 T960 42 T1200 42;M0 42 Q120 60 240 42 T480 42 T720 42 T960 42 T1200 42;M0 42 Q120 19 240 42 T480 42 T720 42 T960 42 T1200 42"/></path>
